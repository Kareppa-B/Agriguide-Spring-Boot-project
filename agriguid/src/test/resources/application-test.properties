# Test profile — H2 in-memory database, no seeding, no Spring Security auto-config password
spring.datasource.url=jdbc:h2:mem:agriguidtest
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT secret must match the one used by the test beans
jwt.secret=TestSecretKeyForH256Algorithm
jwt.expiration.ms=86400000

# DataInitializer is already disabled for the test profile via @Profile("!test")